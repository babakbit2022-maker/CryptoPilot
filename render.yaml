services:
  - type: web
    name: cryptopilot-ai
    runtime: node
    plan: free
    # Use npm install because this repository intentionally does not commit a lockfile yet.
    # npm ci requires package-lock.json/npm-shrinkwrap/yarn.lock and would fail otherwise.
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
