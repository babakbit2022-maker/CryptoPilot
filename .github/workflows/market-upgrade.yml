name: CryptoPilot Market Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade market universe
        run: node scripts/upgrade-market-universe.mjs

      - name: Syntax check
        run: node --check server.js && node --check bootstrap.js && node --check payment-wrapper.js

      - name: Commit upgrade
        run: |
          git config user.name 'CryptoPilot Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js package.json public/index.html scripts/upgrade-market-universe.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Upgrade live market universe and scanner [skip ci]'
            git push
          fi
