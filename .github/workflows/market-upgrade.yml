name: CryptoPilot Market Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade market universe
        run: node scripts/upgrade-market-universe.mjs

      - name: Syntax diagnostics
        run: |
          set +e
          : > .github/syntax-report.txt
          for f in server.js bootstrap.js payment-wrapper.js; do
            echo "=== $f ===" >> .github/syntax-report.txt
            node --check "$f" >> .github/syntax-report.txt 2>&1
            code=$?
            echo "exit=$code" >> .github/syntax-report.txt
            echo >> .github/syntax-report.txt
          done
          exit 0

      - name: Commit upgrade
        run: |
          git config user.name 'CryptoPilot Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js package.json public/index.html scripts/upgrade-market-universe.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Upgrade live market universe and scanner [skip ci]'
            git push
          fi
