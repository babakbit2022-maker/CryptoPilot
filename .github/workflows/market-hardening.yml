name: CryptoPilot Market API Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden live candle API
        run: node scripts/harden-market-api.mjs
      - name: Syntax check
        run: node --check server.js && node --check bootstrap.js && node --check payment-wrapper.js
      - name: Commit hardening
        run: |
          git config user.name 'CryptoPilot Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js scripts/harden-market-api.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden live candle API failover [skip ci]'
          git push
