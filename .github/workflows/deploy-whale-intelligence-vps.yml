name: Deploy Whale Intelligence VPS
on:
  push:
    branches: [fix/technical-stability-2026-09-19]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/cryptopilot
            git fetch origin fix/technical-stability-2026-09-19
            git checkout fix/technical-stability-2026-09-19
            git reset --hard origin/fix/technical-stability-2026-09-19
            node --check server.js
            python3 - <<'PY'
            from pathlib import Path
            import re
            s=Path('public/index.html').read_text()
            m=re.search(r'<script>(.*?)</script>',s,re.S)
            if not m: raise SystemExit('NO_INLINE_SCRIPT')
            Path('/tmp/index-inline.js').write_text(m.group(1))
            PY
            node --check /tmp/index-inline.js
            pm2 restart cryptopilot --update-env
            sleep 6
            test "$(curl -sS -o /tmp/w -w '%{http_code}' http://127.0.0.1:3000/api/whale-intelligence)" = 200
            test "$(curl -sS -o /tmp/c -w '%{http_code}' http://127.0.0.1:3000/api/coins)" = 200
            python3 - <<'PY'
            import json
            w=json.load(open('/tmp/w'))
            c=json.load(open('/tmp/c'))
            assert w.get('universe',0) >= 400, w
            assert w.get('coverage',0) >= 100, w
            assert isinstance(w.get('signals'),list), w
            assert len(c.get('coins',[])) >= 400, c
            print('WHALE_UNIVERSE=',w.get('universe'))
            print('WHALE_COVERAGE=',w.get('coverage'))
            print('WHALE_SIGNALS=',len(w.get('signals',[])))
            print('COINS=',len(c.get('coins',[])))
            print('WHALE INTELLIGENCE TEST: PASS')
            PY
