name: CryptoPilot Guardian Self-Heal

on:
  workflow_run:
    workflows: ["CryptoPilot Guardian"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cryptopilot-guardian-self-heal
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  self-heal:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Diagnose and apply safe runtime recovery
        uses: appleboy/ssh-action@v1.2.2
        env:
          BASE_URL: http://87.107.190.74
        with:
          host: 87.107.190.74
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 5m
          envs: BASE_URL
          script: |
            set -u
            cd /opt/cryptopilot
            echo "=== RUNTIME SNAPSHOT ==="
            pm2 status || true
            pm2 describe cryptopilot || true
            echo "=== LOCAL HEALTH BEFORE ==="
            curl --silent --show-error --max-time 15 "$BASE_URL/api/health" || true

            if curl --silent --show-error --fail --max-time 15 "$BASE_URL/api/health" >/dev/null 2>&1; then
              echo "LOCAL_HEALTH_ALREADY_OK"
            else
              echo "LOCAL_HEALTH_FAILED_RESTARTING_PM2"
              pm2 restart cryptopilot || true
              sleep 8
            fi

            echo "=== LOCAL HEALTH AFTER ==="
            curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/health"
            echo "=== READY ==="
            curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/ready"
            echo "=== PROCESS ==="
            pm2 status

      - name: Re-run production smoke test
        env:
          BASE_URL: http://87.107.190.74
        run: node .github/production-smoke.mjs

      - name: Verify critical production markers
        env:
          BASE_URL: http://87.107.190.74
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/health" | grep -Fq '"ok"'
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/coins" | grep -Fq '"count"'
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/daily-picks" | grep -Fq '"picks"'
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/screenshot-assets" | grep -Fq '"ok":true'
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/" | grep -Fq 'growthViewport'
          echo "GUARDIAN_SELF_HEAL_VERIFIED"

      - name: Open incident if recovery failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 CryptoPilot Guardian recovery failed';
            const marker = '<!-- cryptopilot-guardian-recovery -->';
            const run = context.runId;
            const body = [
              marker,
              'Guardian detected a production failure and the safe runtime recovery did not restore all production checks.',
              '',
              'Recovery attempted: PM2 restart only when local /api/health was unavailable.',
              'No source code, payment wallet, or payment settings were changed by this workflow.',
              'Self-heal run: ' + run,
              'Time: ' + new Date().toISOString()
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });
            const existing = issues.find(i => i.title === title && i.body?.includes(marker));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recovery failed again. Run: ' + run + ' at ' + new Date().toISOString()
              });
            }
