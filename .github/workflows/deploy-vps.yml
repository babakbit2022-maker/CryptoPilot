name: Deploy CryptoPilot to the production site IP

on:
  push:
    branches: [main, appdeploy-vps-transfer-20260919]
  workflow_dispatch:

concurrency:
  group: cryptopilot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

      - name: Deploy to the production site server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: 87.107.190.74
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 10m
          envs: DEPLOY_SHA
          script: |
            set -e
            test -n "$DEPLOY_SHA"
            mkdir -p /opt/cryptopilot
            cd /opt/cryptopilot
            if [ ! -d .git ]; then
              git clone https://github.com/babakbit2022-maker/CryptoPilot.git .
            fi
            git remote set-url origin https://github.com/babakbit2022-maker/CryptoPilot.git
            git fetch --prune origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            echo "DEPLOYED_SHA:"
            git rev-parse HEAD
            npm install --omit=dev --no-audit --no-fund
            npm install -g pm2
            pm2 startOrRestart ecosystem.config.cjs --env production
            pm2 save
            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi
            cat >/etc/nginx/sites-available/cryptopilot <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_read_timeout 120s;
                }
            }
            NGINX
            ln -sf /etc/nginx/sites-available/cryptopilot /etc/nginx/sites-enabled/cryptopilot
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl enable nginx
            systemctl restart nginx
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi
            sleep 5
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/api/health
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1/api/health

      - name: Deep production smoke test
        env:
          BASE_URL: http://87.107.190.74
        run: node .github/production-smoke.mjs
      - name: Verify the actual production site
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -e
          curl --fail --silent --show-error --max-time 20 http://87.107.190.74/api/health
          ROOT="$(curl --fail --silent --show-error --max-time 20 http://87.107.190.74/)"
          printf '%s' "$ROOT" | grep -q "growthViewport"
          printf '%s' "$ROOT" | grep -q "marketStats"
          echo "Production site 87.107.190.74 is serving $DEPLOY_SHA."
