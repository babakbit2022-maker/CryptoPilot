name: Deploy CryptoPilot to the production site IP

on:
  push:
    branches: [appdeploy-vps-transfer-20260919]
  workflow_dispatch:

concurrency:
  group: cryptopilot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

      - name: Deploy to the production site server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PAYMENT_WALLET_PART1: TVF8neJkqF92NooEzJP1EL
          PAYMENT_WALLET_PART2: AVubprXtN2SS
          PREMIUM_PRICE_USDT: "10"
        with:
          host: 87.107.190.74
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 10m
          envs: DEPLOY_SHA,PAYMENT_WALLET_PART1,PAYMENT_WALLET_PART2,PREMIUM_PRICE_USDT
          script: |
            set -e
            test -n "$DEPLOY_SHA"
            mkdir -p /opt/cryptopilot
            cd /opt/cryptopilot
            BACKUP_DIR="/opt/cryptopilot-backups"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$BACKUP_DIR"
            if [ -d .git ]; then
              PREV_SHA="$(git rev-parse HEAD || true)"
              if [ -n "$PREV_SHA" ]; then
                git archive --format=tar.gz --prefix="cryptopilot-$PREV_SHA/" "$PREV_SHA" > "$BACKUP_DIR/source-$STAMP-$PREV_SHA.tar.gz"
                echo "$PREV_SHA" > .rollback-sha
              fi
            fi
            if [ -f /etc/cryptopilot.env ]; then install -m 600 /etc/cryptopilot.env "$BACKUP_DIR/env-$STAMP"; fi
            if [ -f cryptopilot.db ]; then cp -p cryptopilot.db "$BACKUP_DIR/db-$STAMP.sqlite"; fi
            find "$BACKUP_DIR" -type f -mtime +14 -delete
            if [ ! -d .git ]; then
              git clone https://github.com/babakbit2022-maker/CryptoPilot.git .
            fi
            git remote set-url origin https://github.com/babakbit2022-maker/CryptoPilot.git
            git fetch --prune origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            echo "DEPLOYED_SHA:"
            git rev-parse HEAD
            npm install --omit=dev --no-audit --no-fund
            npm install -g pm2
            if [ -f /etc/cryptopilot.env ]; then set -a; . /etc/cryptopilot.env; set +a; fi
            PAYMENT_WALLET="${PAYMENT_WALLET_PART1}${PAYMENT_WALLET_PART2}"
            if [ -n "$PAYMENT_WALLET" ] && [ "$PREMIUM_PRICE_USDT" = "10" ]; then
              if grep -q "^PAYMENT_WALLET=" /etc/cryptopilot.env 2>/dev/null; then sed -i "s/^PAYMENT_WALLET=.*/PAYMENT_WALLET=$PAYMENT_WALLET/" /etc/cryptopilot.env; else echo "PAYMENT_WALLET=$PAYMENT_WALLET" >> /etc/cryptopilot.env; fi
              if grep -q "^PREMIUM_PRICE_USDT=" /etc/cryptopilot.env 2>/dev/null; then sed -i "s/^PREMIUM_PRICE_USDT=.*/PREMIUM_PRICE_USDT=$PREMIUM_PRICE_USDT/" /etc/cryptopilot.env; else echo "PREMIUM_PRICE_USDT=$PREMIUM_PRICE_USDT" >> /etc/cryptopilot.env; fi
              chmod 600 /etc/cryptopilot.env
              pm2 startOrRestart ecosystem.config.cjs --env production --update-env
            elif [ -f /root/.pm2/dump.pm2.bak ]; then
              cp /root/.pm2/dump.pm2.bak /root/.pm2/dump.pm2
              pm2 resurrect
            else
              pm2 restart cryptopilot
            fi
            pm2 save
            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi
            cat >/etc/nginx/sites-available/cryptopilot <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_read_timeout 120s;
                }
            }
            NGINX
            ln -sf /etc/nginx/sites-available/cryptopilot /etc/nginx/sites-enabled/cryptopilot
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl enable nginx
            systemctl restart nginx
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
              ufw allow 3000/tcp || true
            fi
            if command -v firewall-cmd >/dev/null 2>&1; then
              firewall-cmd --permanent --add-service=http || true
              firewall-cmd --permanent --add-service=https || true
              firewall-cmd --reload || true
            fi
            if command -v iptables >/dev/null 2>&1; then
              iptables -C INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport 80 -j ACCEPT || true
              iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport 443 -j ACCEPT || true
            fi
            if command -v nft >/dev/null 2>&1; then
              nft list ruleset >/tmp/cryptopilot-nft.txt 2>/dev/null || true
            fi
            echo "=== PUBLIC LISTENERS ==="
            ss -ltnp | grep -E ':(80|443|3000)\\b' || true
            echo "=== FIREWALL ==="
            (ufw status verbose || true)
            (iptables -S INPUT 2>/dev/null | head -80 || true)
            sleep 5
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/api/health
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1/api/health

      - name: Deep production smoke test
        env:
          BASE_URL: http://87.107.190.74
        run: node .github/production-smoke.mjs
      - name: Verify the actual production site
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -e
          curl --fail --silent --show-error --max-time 20 http://87.107.190.74/api/health
          ASSETS="$(curl --fail --silent --show-error --max-time 20 http://87.107.190.74/api/screenshot-assets)"
          printf '%s' "$ASSETS" | grep -q '"ok":true'
          printf '%s' "$ASSETS" | grep -q '"coins"'
          ROOT="$(curl --fail --silent --show-error --max-time 20 http://87.107.190.74/)"
          printf '%s' "$ROOT" | grep -q "growthViewport"
          printf '%s' "$ROOT" | grep -q "marketStats"
          echo "Production site 87.107.190.74 is serving $DEPLOY_SHA."
