name: Deploy CryptoPilot to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cryptopilot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e
            mkdir -p /opt/cryptopilot
            cd /opt/cryptopilot
            if [ ! -d .git ]; then
              git clone https://github.com/babakbit2022-maker/CryptoPilot.git .
            else
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            fi
            npm install --omit=dev --no-audit --no-fund
            npm install -g pm2
            pm2 startOrRestart ecosystem.config.cjs --env production
            pm2 save

            # Expose the Node app safely on HTTP through nginx.
            # This only changes VPS networking; it does not touch app UI or payment configuration.
            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi
            cat >/etc/nginx/sites-available/cryptopilot <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_read_timeout 120s;
                }
            }
            NGINX
            ln -sf /etc/nginx/sites-available/cryptopilot /etc/nginx/sites-enabled/cryptopilot
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl enable nginx
            systemctl restart nginx
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi
            echo "VPS_LOCAL_IPS:"
            hostname -I || true
            echo "VPS_PUBLIC_IP:"
            curl -4 --silent --show-error --max-time 10 https://api.ipify.org || true
            echo
            echo "LISTENING_PORTS:"
            ss -lntp | grep -E ':(80|443|3000)\\b' || true
            echo "FIREWALL_STATUS:"
            if command -v ufw >/dev/null 2>&1; then ufw status verbose || true; fi

            sleep 5
            if ! curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3000/api/health; then
              echo "Health check failed; recent PM2 logs:"
              pm2 status || true
              pm2 logs cryptopilot --lines 80 --nostream || true
              exit 1
            fi
            if ! curl --fail --silent --show-error --max-time 20 http://127.0.0.1/api/health; then
              echo "Nginx reverse proxy health check failed"
              systemctl status nginx --no-pager || true
              nginx -t || true
              exit 1
            fi

      - name: Verify public VPS endpoint and latest ticker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -e
          echo "Checking public VPS endpoint"
          curl --fail --silent --show-error --max-time 20 "http://$VPS_HOST/api/health"
          echo
          curl --fail --silent --show-error --max-time 20 "http://$VPS_HOST/" | grep -q "growthViewport"
          echo "Public endpoint is serving the latest moving Highest Growth ticker."
