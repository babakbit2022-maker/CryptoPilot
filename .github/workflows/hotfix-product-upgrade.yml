name: Apply CryptoPilot product upgrade
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/hotfix-product-upgrade.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('server.js'); s=p.read_text()
          s=s.replace("const tfMap={'15m':15,'1h':60,'4h':240,'1d':1440};", "const tfMap={'1m':1,'15m':15,'1h':60,'4h':240,'1d':1440};")
          marker="app.get('/api/market/:symbol',async(req,res)=>{"
          if "app.get('/api/ai/market-intelligence'" not in s:
            endpoint="""app.get('/api/ai/market-intelligence',async(req,res)=>{try{const symbol=String(req.query.symbol||'BTCUSDT').toUpperCase();await refreshMarketUniverse();if(!symbols[symbol])return res.status(400).json({error:'unsupported_market'});const tfs=['1m','15m','1h','4h'];const reports=await Promise.all(tfs.map(async tf=>{try{const j=await getAnalysis(symbol,tf);return {tf,provider:j.provider,updatedAt:j.updatedAt,analysis:j.analysis};}catch{return {tf,available:false};}}));const usable=reports.filter(x=>x.analysis);if(!usable.length)return res.status(503).json({error:'market_unavailable'});const bull=Math.round(usable.reduce((n,x)=>n+Number(x.analysis.bullScore||0),0)/usable.length);const bear=Math.round(usable.reduce((n,x)=>n+Number(x.analysis.bearScore||0),0)/usable.length);const risk=Math.round(usable.reduce((n,x)=>n+Number(x.analysis.riskScore||50),0)/usable.length);const trend=bull>=65?'Bullish':bear>=65?'Bearish':'Mixed';const alignment=usable.filter(x=>(trend==='Bullish'?Number(x.analysis.bullScore||0)>=60:trend==='Bearish'?Number(x.analysis.bearScore||0)>=60:true)).length;const latest=usable.find(x=>x.tf==='1h')?.analysis||usable[0].analysis;const reasoning=['Multi-timeframe trend: '+trend+'.','Timeframe alignment: '+alignment+'/'+usable.length+'.','Average bull score: '+bull+'/100; bear score: '+bear+'/100.','Average risk: '+risk+'/100.',latest.rsi!=null?'RSI: '+Number(latest.rsi).toFixed(1)+'.':'RSI unavailable.',latest.volumeRatio!=null?'Volume ratio: '+Number(latest.volumeRatio).toFixed(2)+'x.':'Volume data unavailable.'];res.json({ok:true,symbol,updatedAt:new Date().toISOString(),engine:'CryptoPilot Multi-Timeframe AI',trend,bullScore:bull,bearScore:bear,riskScore:risk,confidence:Math.max(bull,bear),reasoning,reports});}catch(e){res.status(503).json({error:'ai_market_unavailable'});}});\n\n"""
            s=s.replace(marker,endpoint+marker,1)
          p.write_text(s)

          p=Path('public/crypto-chart.html'); s=p.read_text()
          s=s.replace('<button data-tf="15m">15m</button>', '<button data-tf="1m">1M</button><button data-tf="15m">15m</button>')
          s=s.replace("loadCoins().then(load);setInterval(load,15000);setInterval(loadCoins,300000);", "loadCoins().then(load);setInterval(load,5000);setInterval(loadCoins,300000);")
          p.write_text(s)

          p=Path('public/index.html'); s=p.read_text()
          s=s.replace('100+ tracked assets','500 tracked assets')
          s=s.replace('<button data-view="account">Account</button>', '<button data-view="account" onclick="location.href=\'/account.html\'">Account</button>')
          s=s.replace('<button data-view="account">◎<br>Account</button>', '<button data-view="account" onclick="location.href=\'/account.html\'">◎<br>Account</button>')
          p.write_text(s)

          Path('public/account.html').write_text(r'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoPilot AI — Login & Register</title><style>body{margin:0;background:#06101c;color:#f5f8fc;font:14px system-ui}.wrap{max-width:520px;margin:8vh auto;padding:20px}.panel{background:#0b1726;border:1px solid #1d3148;border-radius:20px;padding:26px}input{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:10px;border:1px solid #29425b;background:#071320;color:#fff}button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:10px;background:linear-gradient(135deg,#2eaddb,#6d62df);color:#fff;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{background:#12243a}.tabs button.active{background:linear-gradient(135deg,#2eaddb,#6d62df)}.muted{color:#8194aa;font-size:11px}.msg{margin-top:12px;min-height:18px}.back{display:inline-block;color:#64e6ff;margin-bottom:14px}</style></head><body><div class="wrap"><a class="back" href="/">← Dashboard</a><div class="panel"><h1>CryptoPilot AI</h1><p class="muted">Secure account access for Free and Premium features.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Register</button></div><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><button id="submit">Login</button></form><div id="msg" class="msg"></div></div></div><script>let mode='login';const form=document.getElementById('form'),msg=document.getElementById('msg');loginTab.onclick=()=>{mode='login';loginTab.classList.add('active');registerTab.classList.remove('active');submit.textContent='Login'};registerTab.onclick=()=>{mode='register';registerTab.classList.add('active');loginTab.classList.remove('active');submit.textContent='Create account'};form.onsubmit=async e=>{e.preventDefault();msg.textContent='Working…';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'request_failed');msg.textContent=mode==='login'?'Login successful. Redirecting…':'Account created. Redirecting…';setTimeout(()=>location.href='/',500)}catch(e){msg.textContent=e.message==='email_exists'?'This email is already registered.':e.message==='invalid_login'?'Email or password is incorrect.':'Please check your details and try again.'}}</script></body></html>''')
          PY
      - name: Commit upgrade
        run: |
          git config user.name "CryptoPilot Upgrade Bot"
          git config user.email "actions@github.com"
          git add server.js public/index.html public/crypto-chart.html public/account.html
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade live charts auth AI intelligence and market movers"
          git push
