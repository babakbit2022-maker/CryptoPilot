name: CryptoPilot Free Video Generator

'on':
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

concurrency:
  group: cryptopilot-free-video
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout CryptoPilot
        uses: actions/checkout@v4

      - name: Fetch live market snapshot
        id: market
        shell: bash
        run: |
          set -e
          BTC=$(curl -fsSL 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true' | python -c "import sys,json; d=json.load(sys.stdin)['bitcoin']; print(f\"{d['usd']:.2f}|{d.get('usd_24h_change',0):.2f}\")")
          ETH=$(curl -fsSL 'https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd&include_24hr_change=true' | python -c "import sys,json; d=json.load(sys.stdin)['ethereum']; print(f\"{d['usd']:.2f}|{d.get('usd_24h_change',0):.2f}\")")
          echo "btc=$BTC" >> "$GITHUB_OUTPUT"
          echo "eth=$ETH" >> "$GITHUB_OUTPUT"

      - name: Prepare free generator
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/itsPremkumar/Automated-Video-Generator.git /tmp/avg
          mkdir -p /tmp/avg/input/scripts /tmp/avg/output
          cat > /tmp/avg/input/scripts/input-scripts.json <<'JSON'
          [{"id":"cryptopilot-daily","title":"CryptoPilot Daily Market Brief","orientation":"portrait","language":"english","script":"CryptoPilot AI Daily Market Brief. Bitcoin is trading near $BTC_PRICE, with a 24 hour move of $BTC_CHANGE percent. Ethereum is near $ETH_PRICE, with a 24 hour move of $ETH_CHANGE percent. Remember: price moves fast, so manage risk and never treat an AI analysis as a guarantee. Check CryptoPilot AI for live market data, technical analysis, Market Risk, Daily AI Picks, and AI Trade Vision. Learn first, trade carefully, and verify every decision yourself."}]
          JSON
          python - <<'PY'
          import json, os
          p='/tmp/avg/input/scripts/input-scripts.json'
          s=open(p).read()
          s=s.replace('$BTC_PRICE',os.environ['BTC_PRICE']).replace('$BTC_CHANGE',os.environ['BTC_CHANGE']).replace('$ETH_PRICE',os.environ['ETH_PRICE']).replace('$ETH_CHANGE',os.environ['ETH_CHANGE'])
          open(p,'w').write(s)
          PY
        env:
          BTC_PRICE: ${{ steps.market.outputs.btc && fromJSON('[''"'"''${{ steps.market.outputs.btc }}''"'"'']')[0] || 'unknown' }}
          BTC_CHANGE: 'market'
          ETH_PRICE: 'market'
          ETH_CHANGE: 'market'

      - name: Generate MP4 with free open-source pipeline
        shell: bash
        run: |
          set -e
          cd /tmp/avg
          npm ci --no-audit --no-fund
          TTS_PROVIDER=edge-tts OPENVERSE_ENABLED=true npm run generate
          mkdir -p "$GITHUB_WORKSPACE/dist"
          MP4=$(find output -type f -iname '*.mp4' | head -n 1)
          test -n "$MP4"
          cp "$MP4" "$GITHUB_WORKSPACE/dist/CryptoPilot-Daily-Short.mp4"

      - name: Verify MP4
        shell: bash
        run: |
          set -e
          test -s dist/CryptoPilot-Daily-Short.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 dist/CryptoPilot-Daily-Short.mp4

      - name: Publish stable video release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-video-free
          name: CryptoPilot Daily Short (Free Generator)
          body: Free open-source generated CryptoPilot daily short.
          files: dist/CryptoPilot-Daily-Short.mp4
          make_latest: false
