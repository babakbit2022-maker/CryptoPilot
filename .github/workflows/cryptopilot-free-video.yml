name: CryptoPilot Free Video Generator

'on':
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: write

concurrency:
  group: cryptopilot-free-video
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout CryptoPilot
        uses: actions/checkout@v4

      - name: Fetch live market snapshot
        id: market
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.request
          def get(coin):
              u=f'https://api.coingecko.com/api/v3/simple/price?ids={coin}&vs_currencies=usd&include_24hr_change=true'
              d=json.load(urllib.request.urlopen(u, timeout=20))[coin]
              return f"{d['usd']:.2f}", f"{d.get('usd_24h_change', 0):.2f}"
          bp,bc=get('bitcoin'); ep,ec=get('ethereum')
          print(f'btc_price={bp}'); print(f'btc_change={bc}'); print(f'eth_price={ep}'); print(f'eth_change={ec}')
          PY

      - name: Prepare free generator
        env:
          BTC_PRICE: ${{ steps.market.outputs.btc_price }}
          BTC_CHANGE: ${{ steps.market.outputs.btc_change }}
          ETH_PRICE: ${{ steps.market.outputs.eth_price }}
          ETH_CHANGE: ${{ steps.market.outputs.eth_change }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/itsPremkumar/Automated-Video-Generator.git /tmp/avg
          mkdir -p /tmp/avg/input/scripts /tmp/avg/output
          python - <<'PY'
          import json, os
          job={"id":"cryptopilot-daily","title":"CryptoPilot Daily Market Brief","orientation":"portrait","language":"english","voice":"en-US-AriaNeural","script":f"CryptoPilot AI Daily Market Brief. Bitcoin is trading near ${os.environ['BTC_PRICE']}, with a 24 hour move of {os.environ['BTC_CHANGE']} percent. Ethereum is near ${os.environ['ETH_PRICE']}, with a 24 hour move of {os.environ['ETH_CHANGE']} percent. Price moves fast, so manage risk and never treat AI analysis as a guarantee. Check CryptoPilot AI for live market data, technical analysis, Market Risk, Daily AI Picks, and AI Trade Vision. Learn first, trade carefully, and verify every decision yourself."}
          with open('/tmp/avg/input/scripts/input-scripts.json','w') as f: json.dump([job], f)
          PY

      - name: Generate MP4 with free open-source pipeline
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/avg
          npm ci --no-audit --no-fund
          TTS_PROVIDER=edge-tts OPENVERSE_ENABLED=true npm run generate
          mkdir -p "$GITHUB_WORKSPACE/dist"
          MP4=$(find output -type f -iname '*.mp4' | head -n 1)
          test -n "$MP4"
          cp "$MP4" "$GITHUB_WORKSPACE/dist/CryptoPilot-Daily-Short.mp4"

      - name: Verify MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/CryptoPilot-Daily-Short.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 dist/CryptoPilot-Daily-Short.mp4

      - name: Publish stable video release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-video-free
          name: CryptoPilot Daily Short (Free Generator)
          body: Free open-source generated CryptoPilot daily short.
          files: dist/CryptoPilot-Daily-Short.mp4
          make_latest: false
