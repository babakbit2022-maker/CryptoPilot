name: CryptoPilot CEO Engineer

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  issues: write

jobs:
  engineer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static smoke checks
        id: smoke
        continue-on-error: true
        run: node scripts/ceo-smoke.mjs | tee ceo-smoke.json
      - name: JavaScript syntax checks
        id: syntax
        continue-on-error: true
        run: npm run check
      - name: Production monitor
        id: monitor
        continue-on-error: true
        env:
          CRYPTOPILOT_URL: ${{ vars.CRYPTOPILOT_URL || 'http://87.107.190.74' }}
        run: node scripts/ceo-monitor.mjs | tee ceo-production.json
      - name: Safe auto-repair
        id: repair
        if: steps.smoke.outcome == 'failure' || steps.syntax.outcome == 'failure' || steps.monitor.outcome == 'failure'
        continue-on-error: true
        run: node scripts/ceo-auto-repair.mjs
      - name: Validate repaired source
        id: repair_check
        if: steps.repair.outcome == 'success'
        continue-on-error: true
        run: |
          npm run check
          node scripts/ceo-smoke.mjs
      - name: Re-check production after repair
        id: repair_monitor
        if: steps.repair_check.outcome == 'success'
        continue-on-error: true
        env:
          CRYPTOPILOT_URL: ${{ vars.CRYPTOPILOT_URL || 'https://waterspout-pretty-rhinoceros.abasthan.app' }}
        run: node scripts/ceo-monitor.mjs | tee ceo-production-after-repair.json
      - name: Commit safe repair
        if: steps.repair_check.outcome == 'success' && steps.repair_monitor.outcome == 'success'
        run: |
          if git diff --quiet; then echo 'No source changes were required.'; exit 0; fi
          git config user.name 'CryptoPilot CEO Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js scripts/
          if git diff --cached --quiet; then echo 'No allowlisted repair changes to commit.'; exit 0; fi
          git commit -m 'fix: CEO Engineer safe auto-repair [skip ci]'
          git push
      - name: Create engineering incident
        if: steps.smoke.outcome == 'failure' || steps.syntax.outcome == 'failure' || steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          MONITOR: ${{ steps.monitor.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          REPAIR_CHECK: ${{ steps.repair_check.outcome }}
          REPAIR_MONITOR: ${{ steps.repair_monitor.outcome }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '(no report)';
            const title = 'CEO Agent: Engineering action required';
            const body = [
              '# CryptoPilot CEO Agent', '',
              `Static smoke checks: ${process.env.SMOKE}`,
              `Syntax checks: ${process.env.SYNTAX}`,
              `Production monitor: ${process.env.MONITOR}`,
              `Safe repair: ${process.env.REPAIR}`,
              `Repair validation: ${process.env.REPAIR_CHECK}`,
              `Post-repair production monitor: ${process.env.REPAIR_MONITOR}`, '',
              '## Smoke report', '```json', read('ceo-smoke.json'), '```',
              '## Production report', '```json', read('ceo-production.json'), '```',
              '## Post-repair production report', '```json', read('ceo-production-after-repair.json'), '```', '',
              '### Safe remediation policy',
              '- Never modify wallet addresses or payment configuration automatically.',
              '- Never modify secrets or deployment configuration automatically.',
              '- Never modify UI/public assets, styles, branding, or visual layout automatically.',
              '- Only explicitly allowlisted deterministic repair scripts may change source/infrastructure code.',
              '- A repair is committed only after syntax, smoke, and production checks pass.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 50});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
      - name: Stop if unresolved
        if: (steps.smoke.outcome == 'failure' || steps.syntax.outcome == 'failure' || steps.monitor.outcome == 'failure') && (steps.repair_check.outcome != 'success' || steps.repair_monitor.outcome != 'success')
        run: exit 1
