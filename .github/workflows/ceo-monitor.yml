name: CryptoPilot CEO Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run CEO checks
        id: ceo
        continue-on-error: true
        env:
          CRYPTOPILOT_URL: ${{ vars.CRYPTOPILOT_URL || 'https://waterspout-pretty-rhinoceros.abasthan.app' }}
        run: node scripts/ceo-monitor.mjs | tee ceo-report.json
      - name: Open or update incident issue
        if: steps.ceo.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('ceo-report.json', 'utf8'));
            const title = 'CEO Agent: Production health incident';
            const body = [
              '## CryptoPilot CEO Agent incident',
              '',
              `Checked: ${report.checkedAt}`,
              `Target: ${report.base}`,
              '',
              '### Failures',
              ...report.failures.map(x => `- ${x}`),
              '',
              '### Endpoint results',
              ...report.results.map(x => `- ${x.path}: ${x.status ?? 'network error'} (${x.ms}ms)`)
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 50 });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
      - name: Fail workflow when production is unhealthy
        if: steps.ceo.outcome == 'failure'
        run: exit 1
