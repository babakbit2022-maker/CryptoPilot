name: CryptoPilot Security and Dependency Audit

on:
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: appdeploy-vps-transfer-20260919
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check source syntax
        run: npm run check
      - name: Report audit failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title="🚨 CryptoPilot security/dependency audit failed"; const marker="<!-- cryptopilot-security-audit -->";
            const body=[marker,"The scheduled dependency or source integrity audit failed. Review is required; no automatic dependency upgrades are performed.","","Run: "+context.runId,"Time: "+new Date().toISOString()].join("\n");
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:"open",per_page:50});
            const existing=issues.find(i=>i.title===title&&i.body?.includes(marker));
            if(!existing) await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body:"Audit failed again. Run "+context.runId});