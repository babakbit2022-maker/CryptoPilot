name: Verify live page data rendering
on:
  push:
    branches: [whale-pump-intelligence-2026-09-19]
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -u
            cd /opt/cryptopilot
            git fetch origin whale-pump-intelligence-2026-09-19 --quiet
            git show origin/whale-pump-intelligence-2026-09-19:server.js > /tmp/branch-server.js
            git show origin/whale-pump-intelligence-2026-09-19:public/index.html > /tmp/branch-index.html
            cp server.js "server.js.before-whale-pump-$(date +%Y%m%d-%H%M%S)"
            python3 - <<'PY'
            from pathlib import Path
            p=Path('server.js')
            s=p.read_text()
            old='if(cached&&now-cached.t<3*60*1000)return cached.v;'
            new='if(cached&&now-cached.t<60*1000)return cached.v;'
            if old in s:
                s=s.replace(old,new,1)
            elif new not in s:
                raise SystemExit('UNIVERSE_CACHE_PATTERN_NOT_FOUND')
            p.write_text(s)
            print('LIVE DATA CACHE: max 60s')
            PY
            cp public/index.html "public/index.html.before-whale-pump-$(date +%Y%m%d-%H%M%S)"
            python3 - <<'PY'
            from pathlib import Path
            import re
            cur=Path('server.js').read_text()
            src=Path('/tmp/branch-server.js').read_text()
            if "CREATE TABLE IF NOT EXISTS whale_snapshots" not in cur:
                m=re.search(r"CREATE TABLE IF NOT EXISTS whale_snapshots\([^;]+?\);",src)
                if not m: raise SystemExit('NO_WHALE_TABLE')
                pos=cur.find("CREATE TABLE IF NOT EXISTS ai_predictions")
                end=cur.find(';',pos)+1
                cur=cur[:end]+'\n'+m.group(0)+cur[end:]
            if "function whaleSignal(" not in cur:
                s=src.find("function whaleSignal("); e=src.find("\napp.get('/api/whale-intelligence'",s)
                if s<0 or e<0: raise SystemExit('NO_WHALE_SIGNAL')
                anchor=cur.find("\napp.get(",cur.find("app.get('/api/coins'"))
                if anchor<0: anchor=cur.find("\napp.listen(")
                cur=cur[:anchor]+'\n'+src[s:e]+cur[anchor:]
            if "app.get('/api/whale-intelligence'" not in cur:
                s=src.find("app.get('/api/whale-intelligence'"); e=src.find("\napp.get(",s+10)
                if s<0 or e<0: raise SystemExit('NO_WHALE_ENDPOINT')
                anchor=cur.find("\napp.listen(")
                if anchor<0: anchor=len(cur)
                cur=cur[:anchor]+'\n'+src[s:e]+cur[anchor:]
            Path('server.js').write_text(cur)
            PY
            python3 - <<'PY'
            from pathlib import Path
            import re
            cur=Path('public/index.html').read_text()
            src=Path('/tmp/branch-index.html').read_text()
            if 'id="whaleIntel"' not in cur:
                s=src.find('<section class="panel" style="margin-top:14px"><div class="panelHead"><div><h2>🐋 بازی امروز نهنگ‌ها')
                e=src.find('<section class="contentGrid">',s)
                if s<0 or e<0: raise SystemExit('NO_WHALE_SECTION')
                cur=cur.replace('<section class="contentGrid">',src[s:e]+'<section class="contentGrid">',1)
            if 'function loadWhaleIntelligence()' not in cur:
                s=src.find('async function loadWhaleIntelligence(){'); e=src.find('async function loadDailyIntelligence(){',s)
                if s<0 or e<0: raise SystemExit('NO_WHALE_JS')
                cur=cur.replace('async function loadDailyIntelligence(){',src[s:e]+'async function loadDailyIntelligence(){',1)
            if 'setInterval(loadPumpCandidates,30000)' not in cur:
                cur=cur.replace('load();loadDailyIntelligence();loadWhaleIntelligence();setInterval(load,30000);setInterval(loadDailyIntelligence,60000);setInterval(loadWhaleIntelligence,300000);','load();loadDailyIntelligence();loadWhaleIntelligence();setInterval(load,30000);setInterval(loadDailyIntelligence,60000);setInterval(loadWhaleIntelligence,300000);setInterval(loadPumpCandidates,30000);')
            if 'loadPumpCandidates();' not in cur:
                cur=cur.replace('if(b)showDetail(b);','if(b)showDetail(b);loadPumpCandidates();',1)
            if '.whaleGrid{' not in cur:
                css='<style id="whale-pump-css">.whaleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.whaleCard{background:#081624;border:1px solid #1b3047;border-radius:13px;padding:13px;min-width:0}.whaleTop{display:flex;justify-content:space-between;gap:8px}.whaleDir{font-size:9px;font-weight:800}.whaleCard b{font-size:15px}.whaleMeta{display:flex;justify-content:space-between;gap:8px;color:#8da1b7;font-size:9px;margin-top:7px}.whaleReason{color:#a8b8c8;font-size:10px;line-height:1.45;margin-top:8px}.whaleScore{font-weight:900;font-size:11px}@media(max-width:1100px){.whaleGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.whaleGrid{grid-template-columns:1fr}}</style>'
                cur=cur.replace('</head>',css+'</head>',1)
            Path('public/index.html').write_text(cur)
            PY
            node --check server.js
            python3 - <<'PY'
            from pathlib import Path
            import re
            s=Path('public/index.html').read_text()
            m=re.search(r'<script>(.*?)</script>',s,re.S)
            if not m: raise SystemExit('NO_INLINE_SCRIPT')
            Path('/tmp/live-inline.js').write_text(m.group(1))
            PY
            node --check /tmp/live-inline.js
            pm2 restart cryptopilot --update-env
            sleep 3
            echo "=== WHALE API ==="
            curl -sS --max-time 30 -o /tmp/whale.json -w "whale HTTP=%{http_code} BYTES=%{size_download}\n" http://127.0.0.1:3000/api/whale-intelligence
            python3 - <<'PY'
            import json
            w=json.load(open('/tmp/whale.json'))
            assert w.get('ok') is True
            assert int(w.get('coverage',0)) >= 400
            print('WHALE_UNIVERSE=',w.get('universe'),'WHALE_COVERAGE=',w.get('coverage'))
            PY
            echo "=== HTML DATA HOOKS ==="
            grep -nE "function load\(|/api/coins|/api/market-stats|/api/top-gainers|setLive|coinGrid|coinList|loadDailyIntelligence" public/index.html | head -80 || true
            echo "=== INLINE JS CHECK ==="
            python3 - <<'PY'
            from pathlib import Path
            import re
            s=Path('public/index.html').read_text()
            m=re.search(r'<script>(.*?)</script>',s,re.S)
            if not m: raise SystemExit('NO_INLINE_SCRIPT')
            Path('/tmp/live-inline.js').write_text(m.group(1))
            print('INLINE_BYTES=',len(m.group(1)))
            PY
            node --check /tmp/live-inline.js
            echo "=== API SNAPSHOT ==="
            for u in coins market-stats top-gainers daily-picks; do
              curl -sS --max-time 20 -o /tmp/$u -w "$u HTTP=%{http_code} BYTES=%{size_download}\n" http://127.0.0.1:3000/api/$u || true
            done
            echo "=== FRONTEND MARKERS ==="
            grep -n "System status\|statusGrid" public/index.html || true
            echo "VERIFY LIVE PAGE: PASS"
