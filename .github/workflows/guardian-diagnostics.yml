name: CryptoPilot Guardian Diagnostics

on:
  workflow_run:
    workflows: ["CryptoPilot Guardian Self-Heal"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cryptopilot-guardian-diagnostics
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Collect VPS diagnostics
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 87.107.190.74
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 5m
          script: |
            cd /opt/cryptopilot
            bash scripts/guardian-diagnostics.sh
      - name: Create incident with diagnostics trigger
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 CryptoPilot Guardian diagnostics required';
            const marker = '<!-- cryptopilot-guardian-diagnostics -->';
            const body = [
              marker,
              'Automated Guardian recovery did not complete successfully, so diagnostics were collected on the VPS.',
              'No source code or payment configuration was changed by this workflow.',
              '',
              'Run: ' + context.runId,
              'Time: ' + new Date().toISOString()
            ].join('\n');
            const {data: issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:50});
            const existing=issues.find(i=>i.title===title&&i.body?.includes(marker));
            if(!existing) await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body:'Diagnostics run '+context.runId+' at '+new Date().toISOString()});
