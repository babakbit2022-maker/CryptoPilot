name: CryptoPilot Daily Video

'on':
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryptopilot-daily-video
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Get current market snapshot
        id: market
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true' -o market.json
          echo "BTC=$(jq -r '.bitcoin.usd' market.json)" >> "$GITHUB_OUTPUT"
          echo "BTC24=$(jq -r '.bitcoin.usd_24h_change' market.json)" >> "$GITHUB_OUTPUT"
          echo "ETH=$(jq -r '.ethereum.usd' market.json)" >> "$GITHUB_OUTPUT"
          echo "ETH24=$(jq -r '.ethereum.usd_24h_change' market.json)" >> "$GITHUB_OUTPUT"

      - name: Start free Agnes video generator
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$AGNES_API_KEY" || { echo 'Missing AGNES_API_KEY secret.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/agnes/working" "$RUNNER_TEMP/agnes/config"
          docker pull lcy362/free-short-video:latest
          docker run -d --name agnes-video -p 8765:8765 -e AGNES_API_KEY="$AGNES_API_KEY" -v "$RUNNER_TEMP/agnes/working:/app/.working_dir" -v "$RUNNER_TEMP/agnes/config:/app/.agnes_config" lcy362/free-short-video:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker logs agnes-video || true
          exit 1

      - name: Build daily educational topic
        id: topic
        run: |
          set -euo pipefail
          topics=(
            'Support and resistance: explain what the levels mean and why traders watch reactions near them.'
            'Stop loss basics: explain the purpose of a stop loss and why position size matters.'
            'Risk to reward: explain the concept with a simple 1-to-2 example, without telling viewers to take a trade.'
            'RSI basics: explain what RSI measures and why an extreme reading is not automatically a buy or sell signal.'
            'Trading volume: explain why volume can add context to a price move and what it cannot prove.'
            'Breakouts and fakeouts: explain the difference and why confirmation matters.'
            'Candlestick basics: explain what open, high, low and close represent on a candle.'
            'Market structure: explain higher highs, higher lows, lower highs and lower lows.'
            'Leverage basics: explain how leverage magnifies both gains and losses and why liquidation risk exists.'
            'Trading psychology: explain why FOMO and revenge trading can damage decision-making.'
            'Moving averages: explain what they are and how traders use them as context, not predictions.'
            'Volatility: explain what volatility means and why a volatile market is not automatically bullish or bearish.'
            'Liquidity basics: explain why liquidity matters for execution and slippage.'
            'Diversification basics: explain concentration risk without recommending specific assets.'
            'Trading journal: explain what a useful trading journal records and how it helps review decisions.'
          )
          INDEX=$(( $(date -u +%j) % ${#topics[@]} ))
          echo "TOPIC=${topics[$INDEX]}" >> "$GITHUB_OUTPUT"

      - name: Generate CryptoPilot Educational Short
        env:
          BTC: ${{ steps.market.outputs.BTC }}
          BTC24: ${{ steps.market.outputs.BTC24 }}
          ETH: ${{ steps.market.outputs.ETH }}
          ETH24: ${{ steps.market.outputs.ETH24 }}
          TOPIC: ${{ steps.topic.outputs.TOPIC }}
        run: |
          set -euo pipefail
          IDEA="Create an original CryptoPilot AI educational crypto trading Short for a global English speaking audience. Today's lesson: ${TOPIC} Current market context only: Bitcoin is $${BTC}, 24h change ${BTC24} percent; Ethereum is $${ETH}, 24h change ${ETH24} percent. Make 4 connected vertical scenes totaling about 32 seconds. Scene 1: a strong educational hook. Scene 2: explain the concept clearly in simple language. Scene 3: give a neutral hypothetical example using invented numbers, not a real trade signal. Scene 4: one key takeaway and a subtle CTA to CryptoPilot AI. The video must provide genuine educational value, use original narration and original visual concepts, and materially vary the lesson from other days. Do not give personalized financial advice, do not tell viewers to buy, sell, long, short, or use leverage, and do not promise profits, returns, or guaranteed outcomes. Do not present an AI persona as a financial advisor. Include a small 'Educational content, not financial advice' disclaimer. Modern clean fintech aesthetic, English narration, English subtitles, portrait 9:16."
          IDEA=$(printf '%s' "$IDEA" | LC_ALL=C tr -cd '\11\12\15\40-\176')
          curl -fsS --retry 3 --retry-all-errors -X POST http://127.0.0.1:8765/api/tasks/creative \
            --form-string "idea=$IDEA" \
            --form-string 'creative_name=CryptoPilot Daily Educational Video' \
            --form-string 'style=modern professional fintech education, clean cinematic motion graphics, dark premium dashboard aesthetic, original diagrams and chart concepts' \
            --form-string 'chaining_mode=keyframes' \
            --form-string 'video_width=768' \
            --form-string 'video_height=1152' \
            --form-string 'duration_source=manual' \
            --form-string 'scene_count=4' \
            --form-string 'uniform_duration=true' \
            --form-string 'scene_durations_json=[8,8,8,8]' \
            --form-string 'audio_enabled=true' \
            --form-string 'audio_voice=en-US-AriaNeural' \
            --form-string 'audio_rate=+0%' \
            --form-string 'audio_lang=en' \
            --form-string 'subtitle_enabled=true' \
            --form-string 'subtitle_style_mode=fixed' \
            --form-string 'subtitle_fontsize=42' \
            --form-string 'subtitle_position=bottom' \
            --form-string 'subtitle_stroke_width=2' \
            --form-string 'execution_mode=auto' \
            > task.json
          cat task.json
          TASK_ID=$(jq -r '.task_id // empty' task.json)
          test -n "$TASK_ID"
          echo "TASK_ID=$TASK_ID" >> "$GITHUB_ENV"

      - name: Wait for completed video
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            curl -fsS "http://127.0.0.1:8765/api/tasks/$TASK_ID" -o state.json
            STATUS=$(jq -r '.status // empty' state.json)
            echo "[$i] status=$STATUS"
            if [ "$STATUS" = "COMPLETED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ERROR" ]; then cat state.json; docker logs agnes-video || true; exit 1; fi
            sleep 10
          done
          cat state.json
          docker logs agnes-video || true
          exit 1

      - name: Collect generated video
        run: |
          set -euo pipefail
          VIDEO_PATH=$(jq -r '.final_video_file // empty' state.json)
          test -n "$VIDEO_PATH"
          test -f "$VIDEO_PATH"
          mkdir -p dist
          cp "$VIDEO_PATH" dist/CryptoPilot-Daily-Short.mp4
          ls -lh dist/CryptoPilot-Daily-Short.mp4

      - name: Publish stable public video asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: daily-video
          name: CryptoPilot Daily Video
          body: Latest automatically generated CryptoPilot Daily educational Short.
          prerelease: true
          make_latest: false
          files: dist/CryptoPilot-Daily-Short.mp4
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print stable media URL
        run: echo 'https://github.com/babakbit2022-maker/CryptoPilot/releases/download/daily-video/CryptoPilot-Daily-Short.mp4'
