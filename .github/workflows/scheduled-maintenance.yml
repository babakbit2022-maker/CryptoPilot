name: CryptoPilot Scheduled Maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cryptopilot-scheduled-maintenance
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check production APIs
        env:
          BASE_URL: http://87.107.190.74
        run: |
          set -euo pipefail
          for path in /api/health /api/ready /api/coins /api/market-stats /api/top-gainers /api/daily-picks /api/scanner /api/screenshot-assets; do curl --fail --silent --show-error --max-time 20 "$BASE_URL$path" >/dev/null; done
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/" | grep -Fq growthViewport
          echo "SCHEDULED_PRODUCTION_CHECK_OK"

      - name: Check repository integrity
        uses: actions/checkout@v5
        with:
          ref: appdeploy-vps-transfer-20260919
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

      - name: Run full production smoke
        env:
          BASE_URL: http://87.107.190.74
        run: node .github/production-smoke.mjs

      - name: Create incident on maintenance failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title="🚨 CryptoPilot scheduled maintenance failed";
            const marker="<!-- cryptopilot-scheduled-maintenance -->";
            const body=[marker,"The scheduled production/integrity/smoke checks failed.","No source code or payment configuration was changed by this workflow.","","Run: "+context.runId,"Time: "+new Date().toISOString()].join("\n");
            const {data:issues}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:"open",per_page:50});
            const existing=issues.find(i=>i.title===title&&i.body?.includes(marker));
            if(!existing) await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body:"Maintenance failed again. Run "+context.runId});