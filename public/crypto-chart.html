<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoPilot AI — Live Crypto Chart</title>
<meta name="description" content="Live cryptocurrency hourly and daily price charts powered by CryptoPilot AI market data.">
<style>
:root{--bg:#06101c;--panel:#0b1726;--line:#1d3148;--text:#f5f8fc;--muted:#8194aa;--cyan:#64e6ff;--green:#35d69b;--red:#ff6378;--purple:#9d8cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 20% -10%,#123653,transparent 60%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1440px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#04101a;font-weight:950}.brand b{display:block;font-size:17px}.brand span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.back{color:var(--cyan);text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:10px}.panel{border:1px solid var(--line);background:rgba(9,20,33,.92);border-radius:20px;padding:20px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.symbol{font-size:30px;font-weight:900;letter-spacing:-1px}.price{font-size:28px;font-weight:900;margin-top:2px}.meta{color:var(--muted);font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls button,.controls select{border:1px solid var(--line);background:#081624;color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer}.controls button.active{background:linear-gradient(135deg,#2eaddb,#6d62df);border-color:transparent;font-weight:800}.live{display:inline-flex;align-items:center;gap:7px;border:1px solid #24503f;background:#0a211b;padding:7px 10px;border-radius:99px;color:#a9e9d0;font-size:11px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.chartBox{margin-top:16px;height:min(62vh,620px);min-height:360px;position:relative;background:#071320;border:1px solid #172b40;border-radius:15px;overflow:hidden}.chartBox canvas{width:100%;height:100%;display:block}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:12px}.stat{background:#081624;border:1px solid #182d43;border-radius:12px;padding:11px}.stat small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.stat b{display:block;margin-top:3px;font-size:14px}.footer{color:#61748a;text-align:center;font-size:10px;padding:20px}.error{color:var(--red)}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.head{flex-direction:column}.controls{width:100%}}@media(max-width:600px){.wrap{padding:12px}.panel{padding:14px}.stats{grid-template-columns:1fr 1fr}.chartBox{height:58vh;min-height:320px}.symbol{font-size:24px}.price{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">CP</div><div><b>CryptoPilot AI</b><span>Live chart intelligence</span></div></div><a class="back" href="/">← Dashboard</a></header>
<section class="panel">
<div class="head"><div><div id="symbol" class="symbol">BTC/USDT</div><div id="price" class="price">—</div><div id="meta" class="meta">Connecting to live market candles…</div></div><div class="controls"><button data-tf="15m">15m</button><button data-tf="1h" class="active">1H</button><button data-tf="4h">4H</button><button data-tf="1d">1D</button><select id="coin"><option value="BTCUSDT">BTC/USDT</option><option value="ETHUSDT">ETH/USDT</option><option value="SOLUSDT">SOL/USDT</option><option value="BNBUSDT">BNB/USDT</option><option value="XRPUSDT">XRP/USDT</option><option value="DOGEUSDT">DOGE/USDT</option><option value="ADAUSDT">ADA/USDT</option><option value="AVAXUSDT">AVAX/USDT</option><option value="LINKUSDT">LINK/USDT</option><option value="DOTUSDT">DOT/USDT</option><option value="LTCUSDT">LTC/USDT</option><option value="TRXUSDT">TRX/USDT</option></select><span class="live"><i class="dot"></i>LIVE</span></div></div>
<div class="chartBox"><canvas id="chart"></canvas><div id="empty" class="empty">Loading live candles…</div></div>
<div class="stats"><div class="stat"><small>Open</small><b id="open">—</b></div><div class="stat"><small>High</small><b id="high">—</b></div><div class="stat"><small>Low</small><b id="low">—</b></div><div class="stat"><small>Change</small><b id="change">—</b></div><div class="stat"><small>RSI</small><b id="rsi">—</b></div><div class="stat"><small>Risk</small><b id="risk">—</b></div></div>
</section>
<div class="footer">Live hourly and daily candles · Server-side market feed · Educational only, not financial advice</div>
</div>
<script>
const names={BTC:'Bitcoin',ETH:'Ethereum',SOL:'Solana',BNB:'BNB',XRP:'XRP',DOGE:'Dogecoin',ADA:'Cardano',AVAX:'Avalanche',LINK:'Chainlink',DOT:'Polkadot',LTC:'Litecoin',TRX:'TRON'};
const coin=document.getElementById('coin'),symbolEl=document.getElementById('symbol'),priceEl=document.getElementById('price'),metaEl=document.getElementById('meta'),canvas=document.getElementById('chart'),empty=document.getElementById('empty');
let tf=new URLSearchParams(location.search).get('tf')||'1h';let pair=(new URLSearchParams(location.search).get('symbol')||'BTCUSDT').toUpperCase();let candles=[];let raf=0;
if([...coin.options].some(o=>o.value===pair))coin.value=pair;
document.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{tf=b.dataset.tf;document.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('active',x===b));load()}));
coin.addEventListener('change',()=>{pair=coin.value;load()});
const money=n=>n==null||!Number.isFinite(Number(n))?'—':'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:Number(n)<1?8:2});
const pct=n=>n==null||!Number.isFinite(Number(n))?'—':(n>=0?'+':'')+Number(n).toFixed(2)+'%';
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));draw()}
window.addEventListener('resize',resize);
function draw(){const ctx=canvas.getContext('2d');const w=canvas.width,h=canvas.height;if(!w||!h)return;ctx.clearRect(0,0,w,h);if(!candles.length)return;const d=devicePixelRatio||1;const pad={l:55*d,r:55*d,t:18*d,b:30*d};const vals=candles.map(x=>x[4]);const min=Math.min(...candles.map(x=>x[3]));const max=Math.max(...candles.map(x=>x[2]));const range=max-min||1;const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;const y=v=>pad.t+(max-v)/range*plotH;const x=i=>pad.l+(candles.length===1?plotW/2:i/(candles.length-1)*plotW);ctx.strokeStyle='#183047';ctx.lineWidth=1*d;for(let i=0;i<=5;i++){const yy=pad.t+i*plotH/5;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillStyle='#6f8297';ctx.font=`${10*d}px system-ui`;ctx.fillText(money(max-(range*i/5)),6*d,yy+3*d)}const step=Math.max(1,Math.floor(candles.length/80));for(let i=0;i<candles.length;i+=step){const c=candles[i],xx=x(i),bodyW=Math.max(2*d,Math.min(10*d,plotW/candles.length*.8));const up=c[4]>=c[1];ctx.strokeStyle=up?'#35d69b':'#ff6378';ctx.fillStyle=up?'#35d69b':'#ff6378';ctx.beginPath();ctx.moveTo(xx,y(c[2]));ctx.lineTo(xx,y(c[3]));ctx.stroke();const top=y(Math.max(c[1],c[4])),bh=Math.max(1*d,Math.abs(y(c[1])-y(c[4])));ctx.fillRect(xx-bodyW/2,top,bodyW,bh)}ctx.fillStyle='#6f8297';ctx.font=`${10*d}px system-ui`;const labels=5;for(let i=0;i<labels;i++){const idx=Math.min(candles.length-1,Math.round(i*(candles.length-1)/(labels-1)));const date=new Date(candles[idx][0]);const text=tf==='1d'?date.toLocaleDateString():date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});ctx.fillText(text,x(idx)-20*d,h-8*d)}const last=candles.at(-1);ctx.strokeStyle='#64e6ff';ctx.setLineDash([5*d,5*d]);ctx.beginPath();ctx.moveTo(pad.l,y(last[4]));ctx.lineTo(w-pad.r,y(last[4]));ctx.stroke();ctx.setLineDash([])}
function render(j){candles=j.candles||[];const a=j.analysis||{};symbolEl.textContent=(j.symbol||pair.replace('USDT',''))+'/USDT';priceEl.textContent=money(a.price);metaEl.textContent=`${names[j.symbol]||j.symbol} · ${tf.toUpperCase()} candles · ${j.provider||'market feed'} · updated ${new Date(j.updatedAt).toLocaleTimeString()}`;const last=candles.at(-1),prev=candles.at(-2);document.getElementById('open').textContent=last?money(last[1]):'—';document.getElementById('high').textContent=last?money(last[2]):'—';document.getElementById('low').textContent=last?money(last[3]):'—';document.getElementById('change').textContent=last&&prev?pct((last[4]/prev[4]-1)*100):'—';document.getElementById('rsi').textContent=a.rsi==null?'—':Number(a.rsi).toFixed(1);document.getElementById('risk').textContent=a.riskScore==null?'—':a.riskScore+'/100';empty.style.display=candles.length?'none':'grid';resize()}
async function load(){empty.textContent='Loading live '+tf+' candles…';try{const r=await fetch(`/api/market/${encodeURIComponent(pair)}?tf=${encodeURIComponent(tf)}&limit=250`,{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'market_unavailable');render(j)}catch(e){candles=[];empty.style.display='grid';empty.textContent='Live chart unavailable — retrying automatically';metaEl.textContent='Market feed error';priceEl.textContent='—'}}
load();setInterval(load,30000);
</script>
</body>
</html>
