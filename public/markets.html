<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markets — CryptoPilot AI</title><style>:root{--bg:#06101c;--panel:#0b1726;--line:#1d3148;--text:#f5f8fc;--muted:#8194aa;--cyan:#64e6ff;--green:#35d69b;--red:#ff6378;--yellow:#f5c85b;--blue:#48b9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 600px at 10% -10%,#123653 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#241b49 0,transparent 55%),var(--bg);color:var(--text);font:14px/1.6 system-ui}.wrap{max-width:1250px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0 22px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:22px}.brand{font-weight:900;font-size:18px}.brand span{color:var(--cyan)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none;padding:9px 13px;border-radius:11px;border:1px solid #263d55;background:rgba(10,25,41,.82);font-weight:700;transition:.18s ease}nav a.active,nav a:hover{color:#fff;background:#12243a;border-color:#3b5875}.hero{margin-bottom:18px}.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:1.6px;text-transform:uppercase;font-weight:800}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-2px;margin:8px 0}.hero p{max-width:760px;color:#9eb0c3}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:rgba(9,20,33,.9);border:1px solid var(--line);border-radius:18px;padding:18px}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.value{font-size:27px;font-weight:900}.up{color:var(--green)}.down{color:var(--red)}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 8px;border-bottom:1px solid #17283b;text-align:left}.table th{color:var(--muted);font-size:10px;text-transform:uppercase}.btn{display:inline-flex;padding:10px 14px;border-radius:10px;background:#10243a;border:1px solid #29425b;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--blue),#9d8cff);color:#06101c;border:0}.select{background:#071320;color:#fff;border:1px solid #29425b;padding:11px;border-radius:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.reason{padding:9px 0;border-bottom:1px solid #17283b;color:#b8c8d8}.locked{border:1px solid rgba(245,200,91,.22);background:#17170f;color:#f5c85b;padding:14px;border-radius:14px}.pick{background:#081624;border:1px solid #1b3047;border-radius:14px;padding:14px}.pick b{font-size:18px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}nav{display:none}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><span>CP</span> CryptoPilot AI</div><nav><a href="/">Overview</a><a href="/market-intelligence.html">Market Intelligence</a><a href="/markets.html" class="active">Markets</a><a href="/ai-analysis.html">AI Analysis</a><a href="/account.html">Account</a><a href="/auth.html">Sign In / Register</a></nav></header><section class="hero"><div class="eyebrow">Live markets</div><h1>Markets</h1><p>Browse the tracked crypto universe with live price, movement, volume and market-cap context.</p><div class="row"><input id="search" class="select" placeholder="Search coin or symbol"><a class="btn" href="/market-intelligence.html">Market Intelligence</a></div></section><section class="card"><div class="tableWrap"><table class="table"><thead><tr><th>#</th><th>Asset</th><th>Price</th><th>24h</th><th>Volume</th><th>Market Cap</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let all=[];async function load(){try{const j=await fetch('/api/coins').then(r=>r.json());all=j.coins||[];render()}catch{rows.innerHTML='<tr><td colspan="6">Market data temporarily unavailable.</td></tr>'}}function money(v){return v==null?'—':'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:Number(v)<1?6:2})}function render(){const q=search.value.toLowerCase();rows.innerHTML=all.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.symbol||'').toLowerCase().includes(q)).slice(0,500).map((x,i)=>'<tr onclick="location.href=\'/crypto-chart.html?symbol='+encodeURIComponent((x.symbol||'BTC')+'USDT')+'&tf=1h\'"><td>'+(i+1)+'</td><td><b>'+x.name+'</b><div class="muted">'+x.symbol+'</div></td><td>'+money(x.price)+'</td><td class="'+(Number(x.change24h)>=0?'up':'down')+'">'+(Number(x.change24h)>=0?'+':'')+Number(x.change24h||0).toFixed(2)+'%</td><td>'+money(x.volume24h)+'</td><td>'+money(x.marketCap)+'</td></tr>').join('')||'<tr><td colspan="6">No matching assets.</td></tr>'}search.oninput=render;load();setInterval(load,60000);</script></body></html>
