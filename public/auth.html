<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoPilot AI — Sign in</title><meta name="description" content="Create or access your CryptoPilot AI account."><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06101c;color:#f5f8fc;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(440px,calc(100% - 28px));background:#0b1726;border:1px solid #1d3148;border-radius:22px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.3)}h1{margin:0 0 6px}.muted{color:#8194aa}.tabs{display:flex;gap:8px;margin:22px 0 16px}.tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid #29425b;background:#071320;color:#8194aa;cursor:pointer}.tabs button.active{color:#fff;background:#12243a;border-color:#48b9ff}label{display:block;margin:12px 0 6px;color:#aebed0;font-size:12px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #29425b;background:#071320;color:#fff;outline:0}input:focus{border-color:#48b9ff}button.submit{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#48b9ff,#9d8cff);color:#04101a;font-weight:800;cursor:pointer}.msg{min-height:22px;margin-top:12px;color:#f5c85b}.back{display:block;text-align:center;margin-top:18px;color:#64e6ff;text-decoration:none;font-size:12px}</style></head><body><main class="box"><h1>CryptoPilot AI</h1><div class="muted">Your market intelligence workspace</div><div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div><form id="authForm"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"><button class="submit" id="submit" type="submit">Sign in</button></form><div id="msg" class="msg"></div><a class="back" href="/">← Back to CryptoPilot</a></main><script>let mode='login';const $=id=>document.getElementById(id);function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('submit').textContent=m==='login'?'Sign in':'Create account';$('password').autocomplete=m==='login'?'current-password':'new-password';$('msg').textContent='';}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('authForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='Please wait…';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok){const messages={invalid_credentials:'Enter a valid email and a password of at least 8 characters.',email_exists:'An account with this email already exists.',invalid_login:'Email or password is incorrect.'};throw Error(messages[d.error]||'Could not complete the request.');}$('msg').style.color='#35d69b';$('msg').textContent=mode==='register'?'Account created successfully.':'Signed in successfully.';setTimeout(()=>location.href='/',350); }catch(err){$('msg').style.color='#ff6378';$('msg').textContent=err.message||'Request failed.'}finally{$('submit').disabled=false}};</script><script src="/i18n.js"></script></body></html>
