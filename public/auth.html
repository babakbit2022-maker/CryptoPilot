<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoPilot AI — Sign In / Register</title><style>body{margin:0;background:#06101c;color:#f5f8fc;font:14px system-ui}.wrap{max-width:520px;margin:8vh auto;padding:20px}.panel{background:#0b1726;border:1px solid #1d3148;border-radius:20px;padding:26px}input{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:10px;border:1px solid #29425b;background:#071320;color:#fff}button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:10px;background:linear-gradient(135deg,#2eaddb,#6d62df);color:#fff;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{background:#12243a}.tabs button.active{background:linear-gradient(135deg,#2eaddb,#6d62df)}.muted{color:#8194aa;font-size:11px}.msg{margin-top:12px;min-height:18px}.back{display:inline-block;color:#64e6ff;margin-bottom:14px;text-decoration:none}</style></head><body><div class="wrap"><a class="back" href="/">← Dashboard</a><div class="panel"><h1>CryptoPilot AI</h1><p class="muted">Secure access to your CryptoPilot workspace.</p><div class="tabs"><button id="loginTab" class="active" type="button">Sign In</button><button id="registerTab" type="button">Register</button></div><form id="form"><input id="name" type="text" placeholder="Your name" maxlength="80" style="display:none"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><button id="submit">Sign In</button></form><div id="msg" class="msg"></div></div></div><script>let mode='login';const form=document.getElementById('form'),msg=document.getElementById('msg'),nameEl=document.getElementById('name');loginTab.onclick=()=>{mode='login';loginTab.classList.add('active');registerTab.classList.remove('active');submit.textContent='Sign In';nameEl.style.display='none'};registerTab.onclick=()=>{mode='register';registerTab.classList.add('active');loginTab.classList.remove('active');submit.textContent='Create account';nameEl.style.display='block'};form.onsubmit=async e=>{e.preventDefault();msg.textContent='Working…';try{const body={email:email.value,password:password.value};if(mode==='register')body.name=nameEl.value.trim();const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'request_failed');location.href='/account.html'}catch(e){msg.textContent=e.message==='email_exists'?'This email is already registered.':e.message==='invalid_login'?'Email or password is incorrect.':'Please check your details and try again.'}}</script></body></html>
