<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoPilot AI — Whale Activity</title><style>body{margin:0;background:#06101c;color:#f5f8fc;font:14px system-ui;padding:20px}.wrap{max-width:1100px;margin:auto}.panel{background:#0b1726;border:1px solid #1d3148;border-radius:18px;padding:20px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{background:#0d2235;color:#64e6ff;border:1px solid #29445d;border-radius:10px;padding:9px 12px;text-decoration:none}select{background:#081624;color:#fff;border:1px solid #1d3148;border-radius:10px;padding:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.box{background:#081624;border:1px solid #182d43;border-radius:12px;padding:12px}.box small{display:block;color:#8194aa}.box b{display:block;margin-top:4px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:10px;border-bottom:1px solid #17283b;text-align:right;font-size:11px}.buy{color:#35d69b}.sell{color:#ff6378}.muted{color:#8194aa;font-size:10px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.table{font-size:10px}}</style></head><body><div class="wrap"><div class="panel top"><div><h2 style="margin:0">🐋 فعالیت نهنگ‌ها</h2><div class="muted">ردیابی معاملات بزرگ اخیر در صرافی؛ این بخش هویت کیف‌پول‌های نهنگ را ادعا نمی‌کند.</div></div><a class="btn" href="/">← داشبورد</a></div><div class="panel"><select id="coin"></select><div class="grid" style="margin-top:12px"><div class="box"><small>جریان خرید بزرگ</small><b id="buy">—</b></div><div class="box"><small>جریان فروش بزرگ</small><b id="sell">—</b></div><div class="box"><small>خالص جریان</small><b id="net">—</b></div><div class="box"><small>وضعیت</small><b id="bias">در حال بررسی</b></div></div><div id="time" class="muted" style="margin-top:10px"></div></div><div class="panel"><h3 style="margin-top:0">آخرین معاملات بزرگ</h3><div id="list" class="muted">در حال دریافت داده…</div></div></div><script>const coin=document.getElementById('coin');let pair=new URLSearchParams(location.search).get('symbol')||'BTCUSDT';const fmt=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});async function coins(){try{const j=await fetch('/api/coins').then(r=>r.json());coin.innerHTML=(j.coins||[]).slice(0,100).map(x=>'<option value="'+x.pair+'">'+(x.name||x.symbol)+'</option>').join('');if((j.coins||[]).some(x=>x.pair===pair))coin.value=pair}catch{coin.innerHTML='<option value="BTCUSDT">Bitcoin</option>'}}async function load(){pair=coin.value||pair;history.replaceState(null,'','/whale-activity.html?symbol='+encodeURIComponent(pair));const box=document.getElementById('list');try{const j=await fetch('/api/whales?symbol='+encodeURIComponent(pair)+'&_='+Date.now()).then(r=>r.json());if(!j.ok)throw Error();document.getElementById('buy').textContent=fmt(j.buyNotional);document.getElementById('sell').textContent=fmt(j.sellNotional);document.getElementById('net').textContent=(j.netNotional>=0?'+':'-')+fmt(Math.abs(j.netNotional));document.getElementById('bias').textContent=j.bias;document.getElementById('time').textContent='آخرین بررسی: '+new Date(j.asOf).toLocaleString('fa-IR')+' · آستانه معامله بزرگ: '+fmt(j.threshold);box.innerHTML='<table class="table"><tr><th>زمان</th><th>جهت</th><th>قیمت</th><th>ارزش معامله</th></tr>'+j.largeTrades.map(x=>'<tr><td>'+new Date(x.time).toLocaleTimeString('fa-IR')+'</td><td class="'+(x.side==='BUY'?'buy':'sell')+'">'+x.side+'</td><td>'+Number(x.price).toLocaleString(undefined,{maximumFractionDigits:8})+'</td><td>'+fmt(x.notional)+'</td></tr>').join('')+'</table><p class="muted">'+j.disclaimer+'</p>';}catch{box.textContent='داده فعالیت نهنگ‌ها فعلاً در دسترس نیست.'}}coin.addEventListener('change',load);coins().then(load);setInterval(load,30000)</script></body></html>
