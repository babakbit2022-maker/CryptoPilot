<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoPilot AI — Screenshot Analysis</title><style>body{margin:0;background:#06101c;color:#f5f8fc;font:14px system-ui;padding:20px}.wrap{max-width:900px;margin:auto}.panel{background:#0b1726;border:1px solid #1d3148;border-radius:18px;padding:20px}.btn{background:linear-gradient(135deg,#2eaddb,#6d62df);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800}.back{color:#64e6ff;text-decoration:none}.muted{color:#8194aa;font-size:11px;line-height:1.7}textarea{width:100%;min-height:260px;background:#081624;color:#fff;border:1px solid #1d3148;border-radius:12px;padding:12px;box-sizing:border-box;white-space:pre-wrap}.result{margin-top:14px;background:#081624;border:1px solid #182d43;border-radius:12px;padding:14px;line-height:1.9;white-space:pre-wrap}input,select{margin:10px 0;background:#081624;color:#fff;border:1px solid #1d3148;border-radius:10px;padding:10px;width:100%;box-sizing:border-box}</style></head><body><div class="wrap"><div style="margin-bottom:14px"><a class="back" href="/">← داشبورد</a></div><div class="panel"><h2 style="margin-top:0">📸 تحلیل هوشمند اسکرین‌شات چارت</h2><p class="muted">اسکرین‌شات چارت را انتخاب کن. CryptoPilot AI تصویر را با داده زنده همان ارز ترکیب می‌کند و روند، ساختار، RSI/EMA/حجم، حمایت و مقاومت و سناریوهای احتمالی را توضیح می‌دهد.</p><select id="symbol"><option value="BTCUSDT">BTC/USDT</option></select><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn" id="go">تحلیل اسکرین‌شات</button><div id="out" class="result" style="display:none"></div></div></div><script>const out=document.getElementById('out');document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){out.style.display='block';out.textContent='ابتدا یک تصویر انتخاب کن.';return}if(f.size>8*1024*1024){out.style.display='block';out.textContent='حجم تصویر باید کمتر از ۸ مگابایت باشد.';return}out.style.display='block';out.textContent='در حال تحلیل تصویر و داده زنده…';const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});try{const r=await fetch('/api/ai/screenshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:document.getElementById('symbol').value,image:data})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'error');out.textContent=j.answer+'\n\nزمان تحلیل: '+new Date(j.asOf).toLocaleString('fa-IR')}catch{out.textContent='تحلیل اسکرین‌شات فعلاً در دسترس نیست؛ بعداً دوباره امتحان کن.'}};</script></body></html>
