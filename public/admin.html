<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoPilot Admin Console</title><style>
:root{--bg:#06101d;--p:#0d1b2d;--l:#1c3048;--t:#edf5ff;--m:#91a6bf;--a:#5fe3ff;--g:#35d69b;--r:#ff667b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b15,#0b1b2d);color:var(--t);font:14px Arial}header{padding:18px 24px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}main{max-width:1400px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px}.card small{color:var(--m)}.num{font-size:27px;font-weight:bold;margin-top:7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,button{background:#11253e;color:var(--t);border:1px solid var(--l);border-radius:9px;padding:9px 13px;cursor:pointer}.tabs .on{border-color:var(--a);color:var(--a)}input,textarea,select{background:#081523;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:9px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.hidden{display:none}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{color:var(--m)}.ok{color:var(--g)}.bad{color:var(--r)}.muted{color:var(--m)}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}}
</style></head><body><header><b>⚡ CryptoPilot Admin</b><span id="state" class="muted">Checking…</span></header><main>
<div id="login" class="panel"><h2>Admin Login</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div id="msg" class="muted"></div></div>
<div id="app" class="hidden"><div class="cards" id="cards"></div><div class="tabs"><button class="on" onclick="tab('users',this)">Users</button><button onclick="tab('payments',this)">Payments</button><button onclick="tab('messages',this)">Messages</button><button onclick="tab('analytics',this)">Analytics</button><button onclick="tab('audit',this)">Audit Log</button></div>
<section id="users" class="panel"><h2>Users & Premium</h2><div class="row"><input id="q" placeholder="Search email"><button onclick="users()">Search</button></div><div class="scroll"><table><thead><tr><th>Email</th><th>Plan</th><th>Role</th><th>Created</th><th>Action</th></tr></thead><tbody id="ub"></tbody></table></div></section>
<section id="payments" class="panel hidden"><h2>Payments</h2><div class="scroll"><table><thead><tr><th>User</th><th>TXID</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="pb"></tbody></table></div></section>
<section id="messages" class="panel hidden"><h2>Messages</h2><div class="scroll"><table><thead><tr><th>User</th><th>Subject</th><th>Message</th><th>Status</th><th>Action</th></tr></thead><tbody id="mb"></tbody></table></div></section>
<section id="analytics" class="panel hidden"><h2>Analytics</h2><pre id="ab" class="muted"></pre></section>
<section id="audit" class="panel hidden"><h2>Audit Log</h2><div class="scroll"><table><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Meta</th></tr></thead><tbody id="lb"></tbody></table></div></section>
</div></main><script>
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const A=async(u,o={})=>{const r=await fetch(u,{credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.status);return d};
async function login(){try{await A('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});boot()}catch(e){msg.textContent='Login failed or account is not admin.'}}
async function boot(){try{const d=await A('/api/admin/dashboard');loginEl();cards.innerHTML=[['Users',d.users],['Premium',d.premium],['Free',d.free],['Payments',d.payments],['Pending',d.pending],['Confirmed',d.confirmed],['Messages',d.messages],['Views Today',d.viewsToday]].map(x=>'<div class="card"><small>'+x[0]+'</small><div class="num">'+x[1]+'</div></div>').join('');users()}catch(e){state.textContent='Admin access required';msg.textContent='Login with an administrator account.'}}
function loginEl(){$('login').classList.add('hidden');$('app').classList.remove('hidden');state.textContent='● Online';state.className='ok'}function $(x){return document.getElementById(x)}
async function users(){const d=await A('/api/admin/users?q='+encodeURIComponent(q.value||''));ub.innerHTML=d.users.map(u=>'<tr><td>'+E(u.email)+'</td><td>'+E(u.plan)+'</td><td>'+E(u.role)+'</td><td>'+E(u.created_at)+'</td><td><button onclick="premium('+u.id+',\''+(u.plan==='premium'?'revoke':'grant')+'\')">'+(u.plan==='premium'?'Revoke':'Grant Premium')+'</button></td></tr>').join('')}
async function premium(id,action){const reason=action==='grant'?prompt('Reason (optional):','Partner / Giveaway'):'Admin revoke';if(action==='grant'&&reason===null)return;await A('/api/admin/users/'+id+'/premium',{method:'POST',body:JSON.stringify({action,duration:'lifetime',reason:reason||'Admin grant'})});users();boot()}
async function payments(){const d=await A('/api/admin/payments');pb.innerHTML=d.payments.map(p=>'<tr><td>'+E(p.email)+'</td><td>'+E(p.txid)+'</td><td>'+E(p.status)+'</td><td>'+E(p.created_at)+'</td><td><button onclick="pay('+p.id+',\'confirmed\')">Confirm</button> <button onclick="pay('+p.id+',\'rejected\')">Reject</button></td></tr>').join('')}
async function pay(id,status){await A('/api/admin/payments/'+id,{method:'POST',body:JSON.stringify({status})});payments();boot()}
async function messages(){const d=await A('/api/admin/messages');mb.innerHTML=d.messages.map(m=>'<tr><td>'+E(m.user_email||m.email)+'</td><td>'+E(m.subject)+'</td><td>'+E(m.message)+'</td><td>'+E(m.status)+'</td><td><button onclick="reply('+m.id+')">Reply</button></td></tr>').join('')}
async function reply(id){const text=prompt('Reply:');if(!text)return;await A('/api/admin/messages/'+id+'/reply',{method:'POST',body:JSON.stringify({reply:text})});messages();boot()}
async function analytics(){ab.textContent=JSON.stringify(await A('/api/admin/analytics?days=30'),null,2)}
async function audit(){const d=await A('/api/admin/audit');lb.innerHTML=d.audit.map(a=>'<tr><td>'+E(a.created_at)+'</td><td>'+E(a.email)+'</td><td>'+E(a.action)+'</td><td>'+E(a.meta)+'</td></tr>').join('')}
function tab(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));$(id).classList.remove('hidden');b.classList.add('on');({users,payments,messages,analytics,audit}[id])()}
boot();
</script></body></html>
